<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saad Kakar FreeApps - Free Mobile Apps & Pro Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- Header Section -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <span class="text-2xl">🚀</span>
                <div>
                    <h1 class="font-bold text-lg sm:text-xl text-white">Saad Kakar FreeApps</h1>
                    <p class="text-xs text-slate-400">Free Mobile Apps & Pro Tools</p>
                </div>
            </div>
            <div>
                <!-- Admin Kakar Button with Password & Menu -->
                <button onclick="showAdminMenu()" class="inline-flex items-center px-3 sm:px-4 py-2 text-xs sm:text-sm font-semibold rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white transition shadow-sm">
                    KAKAR
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="text-center max-w-2xl mx-auto mb-10">
            <h2 class="text-3xl font-extrabold tracking-tight sm:text-4xl text-white mb-3">
                Discover & Download Free Mobile Apps
            </h2>
            <p class="text-slate-400 text-sm sm:text-base">
                Your trusted platform for secure APKs, utilities, and essential documents curated by Saad Kakar.
            </p>
        </div>

        <!-- Search Bar -->
        <div class="relative max-w-xl mx-auto mb-8">
            <input type="text" id="searchInput" oninput="filterApps()" placeholder="Search apps, tools..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
        </div>

        <!-- Apps Grid -->
        <div id="appsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Apps will load here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16">
            <span class="text-5xl mb-3 block">📦</span>
            <p class="text-slate-500 font-medium">Koi app mojood nahi hai.</p>
        </div>
    </main>

    <!-- Add App Modal -->
    <div id="addModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 relative shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-4">Add New App / Document</h3>
            <form id="addAppForm" onsubmit="saveApp(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">App Name</label>
                    <input type="text" id="appName" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white text-sm focus:outline-none focus:border-emerald-500" placeholder="e.g. Photo Room">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Category</label>
                        <select id="appCategory" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white text-sm focus:outline-none focus:border-emerald-500">
                            <option value="Tools">Tools</option>
                            <option value="Games">Games</option>
                            <option value="Productivity">Productivity</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Version / Size</label>
                        <input type="text" id="appMeta" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white text-sm focus:outline-none focus:border-emerald-500" placeholder="v1.0 (50 MB)">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Icon Emoji or URL</label>
                    <input type="text" id="appIcon" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white text-sm focus:outline-none focus:border-emerald-500" placeholder="🛠️">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Download URL</label>
                    <input type="url" id="appUrl" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white text-sm focus:outline-none focus:border-emerald-500" placeholder="https://...">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Description</label>
                    <textarea id="appDesc" rows="2" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white text-sm focus:outline-none focus:border-emerald-500" placeholder="Short description..."></textarea>
                </div>
                <div class="flex justify-end space-x-3 space-x-reverse pt-2">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 text-sm text-slate-400 hover:text-white">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-semibold transition">Save App</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        function getApps() {
            return JSON.parse(localStorage.getItem('saad_apps') || '[]');
        }

        function renderApps(appsToDisplay = getApps()) {
            const grid = document.getElementById('appsGrid');
            const emptyState = document.getElementById('emptyState');
            grid.innerHTML = '';

            if (appsToDisplay.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            appsToDisplay.forEach(app => {
                const card = document.createElement('div');
                card.className = 'bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between hover:border-slate-700 transition';
                card.innerHTML = `
                    <div>
                        <div class="flex items-center space-x-3 space-x-reverse mb-3">
                            <div class="w-12 h-12 rounded-xl bg-slate-800 flex items-center justify-center text-2xl">${app.icon}</div>
                            <div>
                                <h3 class="font-bold text-white text-base">${app.name}</h3>
                                <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800/50">${app.category}</span>
                            </div>
                        </div>
                        <p class="text-slate-400 text-xs sm:text-sm mb-4 leading-relaxed">${app.desc}</p>
                    </div>
                    <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between">
                        <span class="text-xs text-slate-500">${app.meta}</span>
                        <a href="${app.url}" target="_blank" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl transition shadow-lg shadow-emerald-900/20">Download APK</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function showAdminMenu() {
            let p = prompt('Admin Password enter karein:');
            if (p === '1234') {
                let choice = prompt('Kya karna chahte hain?\n1. Add File\n2. Delete File');
                if (choice === '1') {
                    document.getElementById('addModal').classList.remove('hidden');
                } else if (choice === '2') {
                    let q = prompt('Jis app ko delete karna hai uska naam bilkul theek likhein:');
                    if (q) {
                        let apps = getApps();
                        let filtered = apps.filter(a => a.name.toLowerCase() !== q.toLowerCase());
                        localStorage.setItem('saad_apps', JSON.stringify(filtered));
                        renderApps();
                        alert('App kamyabi se delete ho gayi!');
                    }
                }
            } else if (p !== null) {
                alert('Ghalat Password!');
            }
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
        }

        function saveApp(e) {
            e.preventDefault();
            const newApp = {
                name: document.getElementById('appName').value,
                category: document.getElementById('appCategory').value,
                meta: document.getElementById('appMeta').value,
                icon: document.getElementById('appIcon').value,
                url: document.getElementById('appUrl').value,
                desc: document.getElementById('appDesc').value
            };

            let apps = getApps();
            apps.unshift(newApp);
            localStorage.setItem('saad_apps', JSON.stringify(apps));
            
            document.getElementById('addAppForm').reset();
            closeAddModal();
            renderApps();
            alert('App kamyabi se add ho gayi!');
        }

        function filterApps() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let apps = getApps();
            let filtered = apps.filter(a => a.name.toLowerCase().includes(query) || a.desc.toLowerCase().includes(query));
            renderApps(filtered);
        }

        // Initial Load
        renderApps();
    </script>
</body>
</html>
